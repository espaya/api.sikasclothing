name: 🚀 Deploy Laravel API to Namecheap Hosting

on:
  push:
    branches:
      - main # or 'master'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, intl, mysql
          coverage: none

      - name: 📦 Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: ⚙️ Optimize Laravel
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      - name: 🧹 Clean up unnecessary files before deploy
        run: |
          rm -rf node_modules
          rm -rf tests
          rm -rf .github
          rm -rf .git
          rm -rf storage/logs/*.log 
          rm -rf bootstrap/cache/*.php

      - name: 📤 Deploy to Namecheap via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4 
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }} 
          password: ${{ secrets.FTP_PASSWORD }}
         
         
          local-dir: ./ # Upload all Laravel files
         
          # security: strict
          # timeout: 60000
