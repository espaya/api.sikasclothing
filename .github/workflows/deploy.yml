name: 🚀 Deploy Laravel API to Namecheap Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, intl, mysql
          coverage: none

      - name: 📦 Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: ⚙️ Optimize Laravel
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      - name: 🔍 Check deployment size
        run: du -sh .

      - name: 🧹 Clean up unnecessary files
        run: |
          rm -rf node_modules 
          rm -rf tests
          rm -rf .github
          # Be more selective about log cleaning
          find storage/logs -name "*.log" -type f -delete
          rm -f bootstrap/cache/*.php

      - name: 📤 Deploy to Namecheap via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          
          # protocol: ftps
          local-dir: ./
          # security: loose
          timeout: 900000
          # log-level: verbose
          exclude: |
            **/.env*
            **/.git*
            **/node_modules*
            **/tests*
